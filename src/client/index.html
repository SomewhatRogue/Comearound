<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#a9cbe0" />
  <title>Come Bye!</title>
  <meta name="description" content="A cozy sheepdog herding game for your browser. Round up the flock with friends, or with bot dogs on your own." />
  <!-- The link preview when someone shares an invite: a collie and her flock in the meadow. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Come Bye!" />
  <meta property="og:title" content="Come Bye! Join my pack" />
  <meta property="og:description" content="A cozy sheepdog herding game. Round up the flock together, right in your browser." />
  <meta property="og:url" content="https://comebye.online/" />
  <meta property="og:image" content="https://comebye.online/og.jpg?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A black and white collie in a sunny meadow, a butterfly by her ear, sheep grazing by a tree behind her" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Come Bye! Join my pack" />
  <meta name="twitter:description" content="A cozy sheepdog herding game. Round up the flock together, right in your browser." />
  <meta name="twitter:image" content="https://comebye.online/og.jpg?v=2" />
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div id="agility-pill" hidden></div>
    <div id="topbar">
      <div id="phase">Lobby</div>
      <div id="clock"><span class="clock-ico"></span><span id="clock-text">0:00</span></div>
      <div id="pens"></div>
      <div id="lost" style="display:none"></div>
      <div id="wind" style="display:none" title="Wind: sheep downwind of you can smell you"><span id="wind-arrow">&#10148;</span>Wind</div>
      <button id="mute" class="audio" title="Sound (M)" aria-label="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lbl">Sound on</span></button>
      <button id="music" class="audio" title="Music" aria-label="Music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V6l10-2v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7" cy="17" r="2.6" fill="currentColor"/><circle cx="17" cy="15" r="2.6" fill="currentColor"/><path class="off" d="M3 3l18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span class="lbl">Music on</span></button>
      <button id="menu-btn" title="Menu (Esc)">Menu</button>
    </div>
    <div id="dogbar">
      <div id="stamina"><div id="stamina-fill"></div></div>
      <div id="bark-key">Bark <kbd>E</kbd></div>
      <div id="posture"></div>
    </div>
    <div id="intro" hidden></div>
    <div id="toasts"></div>
    <div id="pops"></div>
    <div id="controls" hidden>WASD move &middot; Shift sprint &middot; Space crouch (hold still: lie down) &middot; E bark &middot; M sound &middot; Esc menu</div>
  </div>
  <div id="touch" hidden>
    <div class="stick-zone"></div>
    <div class="stick"><div class="knob"></div></div>
    <div class="buttons">
      <button class="down">DOWN</button>
      <button class="bark">BARK</button>
    </div>
  </div>
  <div id="hubbar" hidden></div>
  <div id="lobby" class="side"></div>
  <div id="modal" class="hidden"></div>
  <div id="naughty" class="hidden"><div class="goatface"><div class="ear l"></div><div class="ear r"></div><div class="horn l"></div><div class="horn r"></div><div class="head"></div><div class="eye l"></div><div class="eye r"></div><div class="snout"><i></i><i></i></div></div><div class="word">NAUGHTY</div></div>
  <canvas id="minimap" hidden></canvas>
  <div id="flash"></div>
  <div id="diag" hidden></div>
  <div id="conn">Finding the field&hellip;</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
